<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Class X English Grammar IMCQ - 30</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f7fb;color:#172033;margin:0}.wrap{max-width:900px;margin:auto;padding:18px}
h1{text-align:center}.sub{text-align:center;color:#555;margin-bottom:15px}#progress{position:sticky;top:0;background:#f4f7fb;padding:10px;text-align:center;font-weight:bold;z-index:5}
.card{background:white;border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 2px 9px #0001}.q{font-weight:bold;line-height:1.5;margin-bottom:12px}
label{display:block;padding:11px;border:1px solid #d5d9e0;border-radius:9px;margin:8px 0;cursor:pointer}label:hover{background:#f1f5ff}
button{width:100%;padding:15px;border:0;border-radius:10px;background:#20242b;color:white;font-size:17px;font-weight:bold;cursor:pointer}
#result{display:none;background:white;border-radius:14px;padding:20px;margin:20px 0;box-shadow:0 2px 10px #0002}.review{border-top:1px solid #ddd;padding:15px 0;line-height:1.55}
.ok{font-weight:bold}.bad{font-weight:bold}.why{margin-top:7px;color:#444}
</style></head><body><div class="wrap">
<h1>Interactive English Grammar MCQs</h1>
<div class="sub">Class X • 30 Marks • Tense • Passive Voice • Determiners • Narration • Synthesis</div>
<div id="progress">0 / 30 answered</div><form id="quiz"></form>
<button id="submit" type="button">SUBMIT TEST</button><div id="result"></div></div>
<script>
const qs=[{"q": "When I reached the station, the train ________.", "opts": ["left", "has left", "had left", "was leaving"], "ans": 2, "why": "The train left before I reached the station, so the earlier past action takes Past Perfect: had left."}, {"q": "She ________ in this school since 2022.", "opts": ["teaches", "taught", "has been teaching", "is teaching"], "ans": 2, "why": "The action started in the past and continues now; 'since 2022' supports Present Perfect Continuous: has been teaching."}, {"q": "By next March, he ________ here for five years.", "opts": ["will work", "will have been working", "has worked", "worked"], "ans": 1, "why": "A continuing action measured up to a future point takes Future Perfect Continuous: will have been working."}, {"q": "I wish I ________ the truth earlier.", "opts": ["know", "knew", "had known", "have known"], "ans": 2, "why": "This is regret about the past. After 'I wish' for past regret, use Past Perfect: had known."}, {"q": "It is high time you ________ your studies seriously.", "opts": ["take", "took", "have taken", "will take"], "ans": 1, "why": "After 'It is high time', Past Simple is used for a present demand: took."}, {"q": "Hardly had the meeting begun when the chairman ________ the room.", "opts": ["leaves", "left", "had left", "has left"], "ans": 1, "why": "After 'Hardly had...', the later past action is normally Simple Past: left."}, {"q": "They are repairing the road.", "opts": ["The road is repaired.", "The road was repaired.", "The road is being repaired.", "The road has been repaired."], "ans": 2, "why": "Present Continuous passive is 'is/am/are + being + V3': The road is being repaired."}, {"q": "Someone has stolen my bicycle.", "opts": ["My bicycle has been stolen.", "My bicycle had been stolen.", "My bicycle is stolen.", "My bicycle was being stolen."], "ans": 0, "why": "Present Perfect passive is 'has/have + been + V3': My bicycle has been stolen."}, {"q": "They will announce the result tomorrow.", "opts": ["The result will announce tomorrow.", "The result will be announced tomorrow.", "The result is announced tomorrow.", "The result has been announced tomorrow."], "ans": 1, "why": "Future Simple passive is 'will + be + V3': The result will be announced."}, {"q": "The teacher made the students rewrite the answer.", "opts": ["The students were made rewrite the answer.", "The students were made to rewrite the answer.", "The students made to rewrite the answer.", "The students are made rewrite the answer."], "ans": 1, "why": "After 'make' in active voice, passive uses 'be made to + infinitive': were made to rewrite."}, {"q": "People speak English in many countries.", "opts": ["English is spoken in many countries.", "English was spoken in many countries.", "English has spoken in many countries.", "English speaks in many countries."], "ans": 0, "why": "Simple Present passive is 'is/am/are + V3': English is spoken."}, {"q": "Who wrote this poem?", "opts": ["By whom was this poem written?", "By whom did this poem write?", "Who was this poem wrote by?", "By whom has this poem written?"], "ans": 0, "why": "The Simple Past passive is 'was/were + V3': By whom was this poem written?"}, {"q": "There isn't ________ water in the bottle.", "opts": ["many", "much", "few", "several"], "ans": 1, "why": "Water is uncountable, so 'much' is used in this negative sentence."}, {"q": "________ student in the class must submit the assignment.", "opts": ["Every", "All", "Much", "Many"], "ans": 0, "why": "'Every' is followed by a singular countable noun: every student."}, {"q": "I have ________ books on Indian history.", "opts": ["much", "a little", "several", "little"], "ans": 2, "why": "'Books' is plural countable, so 'several' is appropriate."}, {"q": "________ of the two answers is correct.", "opts": ["Neither", "Many", "Several", "Much"], "ans": 0, "why": "For two people or things, 'neither' means not one and not the other."}, {"q": "He has ________ patience; he gets angry very quickly.", "opts": ["many", "few", "little", "several"], "ans": 2, "why": "'Patience' is uncountable; 'little' means a small amount."}, {"q": "________ information you gave me was useful.", "opts": ["A", "An", "The", "Many"], "ans": 2, "why": "The information is specific—the information already given—so 'the' is required."}, {"q": "He said, “I am busy.”", "opts": ["He said that he is busy.", "He said that I was busy.", "He said that he was busy.", "He told that he was busy."], "ans": 2, "why": "After a past reporting verb, 'am' normally changes to 'was'; 'I' changes to 'he'."}, {"q": "She said to me, “Do you know the answer?”", "opts": ["She asked me if I knew the answer.", "She asked me that did I know the answer.", "She told me if I know the answer.", "She said to me whether I knew the answer?"], "ans": 0, "why": "A yes/no question takes 'if/whether' and statement word order: if I knew the answer."}, {"q": "The teacher said to the boys, “Do not make a noise.”", "opts": ["The teacher told the boys that they did not make a noise.", "The teacher ordered the boys not to make a noise.", "The teacher said the boys not to make a noise.", "The teacher asked the boys that they should not make a noise."], "ans": 1, "why": "A negative command is reported with 'ordered/told + object + not to + verb'."}, {"q": "Rita said, “I have finished my work.”", "opts": ["Rita said that she has finished her work.", "Rita said that she had finished her work.", "Rita said that I had finished my work.", "Rita told that she finished her work."], "ans": 1, "why": "Present Perfect normally changes to Past Perfect after a past reporting verb: had finished."}, {"q": "The boy said, “What a beautiful flower it is!”", "opts": ["The boy exclaimed that it was a very beautiful flower.", "The boy asked whether it was a beautiful flower.", "The boy said that it is a beautiful flower.", "The boy ordered that it was a beautiful flower."], "ans": 0, "why": "This is an exclamation of admiration, so 'exclaimed that it was a very beautiful flower' is correct."}, {"q": "He said to me, “Please help me.”", "opts": ["He ordered me to help him.", "He requested me to help him.", "He said me to help him.", "He asked that I helped him."], "ans": 1, "why": "'Please' makes it a polite request; use 'requested + object + to-infinitive'."}, {"q": "He is poor. He is honest.", "opts": ["Though he is poor, he is honest.", "He is poor because he is honest.", "Being honest, he is poor.", "He is poor and therefore dishonest."], "ans": 0, "why": "The ideas contrast, so 'though' correctly joins them."}, {"q": "He was tired. He continued working.", "opts": ["Because he was tired, he continued working.", "In spite of being tired, he continued working.", "He was tired and stopped working.", "Being tired, he stopped working."], "ans": 1, "why": "The second action happened despite the first condition, so 'in spite of being tired' is correct."}, {"q": "The box is too heavy for me to lift.", "opts": ["The box is so heavy that I cannot lift it.", "The box is very heavy but I can lift it.", "The box is light enough for me to lift.", "The box is so light that I cannot lift it."], "ans": 0, "why": "'Too heavy for me to lift' means 'so heavy that I cannot lift it'."}, {"q": "He worked hard. He failed.", "opts": ["He worked hard because he failed.", "Though he worked hard, he failed.", "He failed so that he worked hard.", "He worked hard and therefore failed."], "ans": 1, "why": "The ideas contrast: he worked hard, yet he failed. 'Though' expresses that contrast."}, {"q": "The sun set. We returned home.", "opts": ["The sun having set, we returned home.", "The sun set because we returned home.", "We returned home before the sun set.", "The sun was setting, so we had returned home."], "ans": 0, "why": "The sun set first. 'The sun having set' correctly shows the earlier completed action."}, {"q": "You must hurry. Otherwise, you will miss the bus.", "opts": ["If you hurry, you will miss the bus.", "Unless you hurry, you will miss the bus.", "Although you hurry, you will miss the bus.", "Because you hurry, you will miss the bus."], "ans": 1, "why": "'Otherwise' here means 'if you do not'; therefore 'unless you hurry' has the same meaning."}];const quiz=document.getElementById('quiz'),progress=document.getElementById('progress'),submit=document.getElementById('submit'),result=document.getElementById('result');
qs.forEach((x,i)=>{const card=document.createElement('div');card.className='card';card.innerHTML='<div class="q">'+(i+1)+'. '+x.q+'</div>';
x.opts.forEach((o,j)=>{const lab=document.createElement('label');lab.innerHTML='<input type="radio" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(65+j)+') '+o;card.appendChild(lab)});quiz.appendChild(card)});
quiz.addEventListener('change',()=>{let n=0;qs.forEach((_,i)=>{if(document.querySelector('input[name="q'+i+'"]:checked'))n++});progress.textContent=n+' / 30 answered'});
submit.onclick=()=>{let score=0,answered=0,review='';
qs.forEach((x,i)=>{const c=document.querySelector('input[name="q'+i+'"]:checked'),v=c?Number(c.value):-1;if(v!==-1)answered++;if(v===x.ans)score++;
review+='<div class="review"><b>Q'+(i+1)+'.</b> '+x.q+'<br>';
if(v===x.ans)review+='<div class="ok">✓ Correct</div>';else{review+='<div class="bad">✗ '+(v===-1?'Not answered':'Wrong')+'</div>';if(v!==-1)review+='<div>Your answer: '+String.fromCharCode(65+v)+') '+x.opts[v]+'</div>';review+='<div><b>Correct answer:</b> '+String.fromCharCode(65+x.ans)+') '+x.opts[x.ans]+'</div><div class="why"><b>Why:</b> '+x.why+'</div>'}review+='</div>'});
result.style.display='block';result.innerHTML='<h2 style="text-align:center">TEST RESULT</h2><p style="text-align:center;font-size:18px"><b>Marks:</b> '+score+' / 30<br><b>Percentage:</b> '+(score/30*100).toFixed(2)+'%<br><b>Answered:</b> '+answered+' / 30</p><hr>'+review;
submit.disabled=true;submit.textContent='TEST SUBMITTED';window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})};
</script></body></html>
